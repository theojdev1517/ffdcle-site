<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fine Findings &amp; Décor | Estate &amp; Resale Service</title>
    <meta name="description" content="Fine Findings & Décor. Estate & Resale Service. Coming Soon! Text 440-230-3901 for more information or a quote.">
    <meta name="theme-color" content="#f5f1e8">
    <link rel="canonical" href="https://www.ffdcle.com/">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style id="site-styles">
:root {
  color-scheme: light;
  --paper: #f5f1e8;
  --ink: #293e34;
  --muted: #586157;
  --accent: #94774b;
  --rule: #c8bda7;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
body { margin: 0; }
.page {
  width: min(100%, 1440px);
  min-height: 100vh;
  min-height: 100svh;
  margin-inline: auto;
  padding: clamp(1.5rem, 4vw, 3rem) clamp(1.5rem, 6vw, 6rem);
  display: flex;
  flex-direction: column;
}
.masthead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--rule);
}
.monogram { font: 1.5rem Georgia, 'Times New Roman', serif; letter-spacing: .16em; }
.site-address { color: var(--muted); font-size: .8rem; letter-spacing: .07em; }
main {
  width: 100%;
  max-width: 62rem;
  margin: auto;
  padding-block: clamp(3rem, 8vh, 6rem);
  text-align: center;
}
.ornament {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: .9rem;
  margin-bottom: 2rem;
}
.ornament span { width: 2.75rem; height: 1px; background: var(--accent); }
.ornament i { width: .5rem; height: .5rem; border: 1px solid var(--accent); transform: rotate(45deg); }
h1 {
  margin: 0;
  font: normal clamp(2.6rem, 7.4vw, 6.25rem)/1.04 Georgia, 'Times New Roman', serif;
  letter-spacing: -.045em;
}
h1 span { display: block; font-style: italic; }
.service {
  margin: 1.75rem 0 0;
  color: var(--muted);
  font-size: clamp(.8rem, 1.4vw, 1rem);
  line-height: 1.6;
  letter-spacing: .18em;
  text-transform: uppercase;
}
.announcement { margin-top: clamp(2.5rem, 6vh, 4rem); }
h2 { margin: 0; font: normal clamp(1.6rem, 3vw, 2rem)/1.25 Georgia, 'Times New Roman', serif; }
.contact { margin: 1.4rem 0 0; }
.sms-link {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 1.25rem;
  min-height: 3.5rem;
  max-width: 100%;
  padding: 1rem 1.5rem;
  border: 1px solid var(--ink);
  border-radius: .2rem;
  background: var(--ink);
  color: #fffdf7;
  font-size: 1rem;
  font-weight: 600;
  line-height: 1.4;
  text-decoration: none;
}
.sms-link:hover { background: #3b5346; }
.sms-link:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
.sms-link span { font-size: 1.25rem; font-weight: normal; line-height: 1; }
.contact-detail { display: block; margin-top: .85rem; color: var(--muted); font-size: .95rem; line-height: 1.6; }
footer { display: flex; align-items: center; gap: 1.5rem; }
.footer-rule { height: 1px; flex: 1; background: var(--rule); }
.footer-mark { color: var(--muted); font: .8rem Georgia, 'Times New Roman', serif; letter-spacing: .1em; }
.footer-mark span { padding-inline: .4rem; color: var(--accent); }
@media (max-width: 420px) {
  .service { max-width: 18rem; margin-inline: auto; letter-spacing: .13em; }
  .sms-link { gap: .8rem; padding-inline: 1.1rem; }
}
@media (forced-colors: active) {
  .sms-link { border: 2px solid LinkText; }
}
    </style>
  </head>
  <body>
    <div class="page">
      <header class="masthead" aria-label="FFD">
        <span class="monogram" aria-hidden="true">FFD</span>
        <span class="site-address" aria-hidden="true">ffdcle.com</span>
      </header>
      <main id="main">
        <div class="ornament" aria-hidden="true"><span></span><i></i><span></span></div>
        <h1>Fine Findings <span>&amp; Décor</span></h1>
        <p class="service">Estate &amp; Resale Service</p>
        <div class="announcement">
          <h2>Coming Soon!</h2>
          <p class="contact">
            <a class="sms-link" href="sms:+14402303901">Text 440-230-3901 <span aria-hidden="true">↗</span></a>
            <span class="contact-detail">for more information or a quote.</span>
          </p>
        </div>
      </main>
      <footer aria-hidden="true"><span class="footer-rule"></span><span class="footer-mark">F<span>·</span>F<span>·</span>D</span><span class="footer-rule"></span></footer>
    </div>
  </body>
</html>
